<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Flexo Supplier Invoice Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --ground:#F3F6F5; --surface:#FFFFFF; --surface-2:#EAF0EE; --line:#D3DDDA; --line-2:#BFCBC7;
  --ink:#15232B; --ink-2:#44545B; --ink-3:#6B7A80;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA;
  --ok:#157A3F; --ok-soft:#DDF3E4; --warn:#9A6100; --warn-soft:#FCEFD4; --bad:#B42318; --bad-soft:#FBE3E0;
  --info:#2A5DB0; --info-soft:#E2EBFA;
  --shadow:0 1px 2px rgba(21,35,43,.06),0 6px 24px rgba(21,35,43,.06);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1719; --surface:#162124; --surface-2:#1C2A2E; --line:#2A3A3F; --line-2:#3A4D52;
    --ink:#E4ECEA; --ink-2:#B3C1BE; --ink-3:#83958F;
    --accent:#3FB39C; --accent-ink:#06201B; --accent-soft:#163A34;
    --ok:#5CCB86; --ok-soft:#173826; --warn:#E3AA4A; --warn-soft:#3A2C12; --bad:#F2877B; --bad-soft:#3F1D1A;
    --info:#86AEF0; --info-soft:#1B2B47;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1719; --surface:#162124; --surface-2:#1C2A2E; --line:#2A3A3F; --line-2:#3A4D52;
  --ink:#E4ECEA; --ink-2:#B3C1BE; --ink-3:#83958F;
  --accent:#3FB39C; --accent-ink:#06201B; --accent-soft:#163A34;
  --ok:#5CCB86; --ok-soft:#173826; --warn:#E3AA4A; --warn-soft:#3A2C12; --bad:#F2877B; --bad-soft:#3F1D1A;
  --info:#86AEF0; --info-soft:#1B2B47;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
@media (max-width:520px){.wrap{padding-inline:16px}}
h1,h2,h3{font-family:var(--cond);margin:0;text-wrap:balance;letter-spacing:.005em}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:15px}
.brand h1{font-size:17px;font-weight:700;line-height:1.1}
.brand .sub{font-size:11.5px;color:var(--ink-3)}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:500;color:var(--ink-2);font-size:13px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}

/* flow strip */
.flow{display:flex;gap:0;align-items:stretch;margin:20px 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.flow-step{flex:1;padding:10px 14px;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.flow-step+.flow-step{border-left:1px solid var(--line)}
.flow-step b{font-family:var(--cond);font-size:13.5px}
.flow-step span{font-size:12px;color:var(--ink-3)}
.flow-step .k{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.04em}
@media (max-width:720px){.flow{flex-direction:column}.flow-step+.flow-step{border-left:0;border-top:1px solid var(--line)}}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:16px;font-weight:600;margin-right:auto}
.panel-b{padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 13px;border-radius:8px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink-2);font-weight:500}
.input,select.input,textarea.input{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.hr{height:1px;background:var(--line);margin:4px 0}
.note{padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;font-family:var(--cond);letter-spacing:.02em}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ready{background:var(--ok-soft);color:var(--ok)}
.p-approved{background:var(--info-soft);color:var(--info)}
.p-paid{background:var(--surface-2);color:var(--ink-2)}
.p-exception{background:var(--warn-soft);color:var(--warn)}
.p-review{background:var(--info-soft);color:var(--info)}
.p-rejected{background:var(--bad-soft);color:var(--bad)}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;font-family:var(--cond)}
.chk.y{background:var(--ok-soft);color:var(--ok)}
.chk.n{background:var(--bad-soft);color:var(--bad)}
.chk.w{background:var(--warn-soft);color:var(--warn)}
.tag{font-size:10.5px;font-family:var(--mono);padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--line)}
.kpi[data-k="ready"]{border-top-color:var(--ok)}
.kpi[data-k="exception"]{border-top-color:var(--warn)}
.kpi[data-k="review"]{border-top-color:var(--info)}
.kpi[data-k="paid"]{border-top-color:var(--ink-3)}
.kpi[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent-soft);border-color:var(--accent)}
.kpi .n{font-family:var(--cond);font-size:26px;font-weight:700;line-height:1.1}
.kpi .amt{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-family:var(--cond);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}

/* drop zone */
.drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:28px 16px;text-align:center;background:var(--surface-2);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--cond);font-size:16px}
.progress{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.scan-state{display:flex;gap:10px;align-items:center;font-size:13px}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}

/* detail drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(10,20,24,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1080px,100%);background:var(--ground);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer-h{display:flex;align-items:center;gap:12px;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.drawer-h h2{font-size:18px;margin-right:auto}
.drawer-b{overflow:auto;padding:18px 20px calc(28px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.drawer-b{grid-template-columns:1fr}}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px}
.preview img{width:100%;border-radius:6px;border:1px solid var(--line);background:#fff}
.preview .ph{aspect-ratio:3/4;display:grid;place-items:center;color:var(--ink-3);font-size:12.5px;text-align:center;padding:16px;border:1px dashed var(--line-2);border-radius:6px;max-width:100%}
.verdict{border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line)}
.verdict.ready{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.verdict.exception{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.verdict.review{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.verdict .big{font-family:var(--cond);font-size:20px;font-weight:700;line-height:1.15}
.verdict.ready .big{color:var(--ok)} .verdict.exception .big{color:var(--warn)} .verdict.review .big{color:var(--info)}
.verdict ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.seal{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:20px;border:2px solid currentColor}
.verdict.ready .seal{color:var(--ok)} .verdict.exception .seal{color:var(--warn)} .verdict.review .seal{color:var(--info)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv dt{font-size:11.5px;color:var(--ink-3)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.match-tbl td{font-size:13px}
.match-tbl .grp{font-family:var(--cond);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center;border-bottom:0;padding-bottom:0}
.match-tbl .sep{border-left:1px solid var(--line)}
.history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.history li{display:flex;gap:10px}
.history time{font-family:var(--mono);color:var(--ink-3);white-space:nowrap;font-size:11.5px}

/* login */
.login{max-width:440px;margin:48px auto}
.login .panel-b{display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);padding:3px;border-radius:9px}
.seg button{border:0;background:transparent;padding:7px;border-radius:7px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:9px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .input{width:auto}
.lines-edit td{padding:4px}
.lines-edit .input{padding:5px 7px;font-size:13px}
.inline-conf{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
</style>

<!-- Supabase hosting: config + runtime shim that provides claude.use(...) -->
<script src="config.js"></script>

<script src="claude-shim.js"></script>
<script>
(() => {
"use strict";
// ---------- state ----------
const S = {
  db:null, assets:null, sample:null, downloads:null, imgLimits:null,
  pos:[], grpos:[], invoices:[], vendors:[], settings:null, meta:null,
  loaded:{pos:false,grpos:false,invoices:false,vendors:false,settings:false},
  session:null, tab:null, filter:"ready", q:"", openId:null,
  draft:null // supplier upload draft
};
const DEFAULT_SETTINGS = { priceTolPct:0.5, qtyTolPct:0, amountTol:1, staffPin:"2026", vatRate:12 };
const $ = (s,el=document)=>el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => { if (v===null||v===undefined||v==="") return null; const x = typeof v==="number"?v:parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(x)?x:null; };
const fmtAmt = (v,cur="PHP") => v==null?"—":(cur?cur+" ":"")+Number(v).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtQty = v => v==null?"—":Number(v).toLocaleString("en-PH",{maximumFractionDigits:3});
const fmtPct = v => v==null?"—":(v>0?"+":"")+v.toFixed(2)+"%";
const fmtDate = s => { if(!s) return "—"; const d=new Date(s); return isNaN(d)?esc(s):d.toLocaleDateString("en-PH",{year:"numeric",month:"short",day:"numeric"}); };
const fmtDT = s => { if(!s) return "—"; const d=new Date(s); return isNaN(d)?esc(s):d.toLocaleString("en-PH",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); };
const normKey = s => String(s??"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const safeId = s => String(s??"").replace(/[^A-Za-z0-9_\-.~:@+]/g,"_").replace(/^\.+$/,"_").slice(0,150) || "x";
const nowISO = () => new Date().toISOString();
const settings = () => Object.assign({}, DEFAULT_SETTINGS, S.settings||{});
function toast(msg){ const r=$("#toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",3200); }
function ss(k,v){ try{ if(v===undefined) return JSON.parse(sessionStorage.getItem(k)||"null"); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }

const STATUS = {
  ready:{label:"Ready for payment",cls:"p-ready",sup:"Received — being processed"},
  approved:{label:"Approved (override)",cls:"p-approved",sup:"Received — being processed"},
  exception:{label:"Exception",cls:"p-exception",sup:"Received — being processed"},
  review:{label:"Needs review",cls:"p-review",sup:"Received — being processed"},
  paid:{label:"Paid",cls:"p-paid",sup:"Paid"},
  rejected:{label:"Returned",cls:"p-rejected",sup:"Returned to supplier"}
};
const pill = (st, supplierView) => { const x=STATUS[st]||STATUS.review; return `<span class="pill ${x.cls}">${esc(supplierView?x.sup:x.label)}</span>`; };

// ---------- vendor helpers ----------
function vendorList(){
  const map = new Map();
  for (const p of S.pos) if (p.vendorCode && !map.has(p.vendorCode)) map.set(p.vendorCode,{code:p.vendorCode,name:p.vendorName||p.vendorCode,accessCode:"",active:false});
  for (const v of S.vendors) map.set(v.code, Object.assign({}, map.get(v.code)||{}, v));
  return [...map.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name)));
}
const vendorName = code => (vendorList().find(v=>v.code===code)||{}).name || code;

// ---------- matching engine ----------
function tokens(s){ return new Set(String(s||"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").split(/\s+/).filter(t=>t.length>1)); }
function sim(a,b){ const A=tokens(a),B=tokens(b); if(!A.size||!B.size) return 0; let i=0; for(const t of A) if(B.has(t)) i++; return i/(A.size+B.size-i); }
function poByNo(no){ const k=normKey(no); return S.pos.find(p=>normKey(p.poNo)===k); }
function receivedFor(poNo, poLine, itemCode){
  const k=normKey(poNo); let qty=0; const docs=[];
  for (const g of S.grpos){
    if (normKey(g.poNo)!==k && !(g.lines||[]).some(l=>normKey(l.poNo)===k)) continue;
    for (const l of (g.lines||[])){
      const lp = l.poNo ? normKey(l.poNo) : normKey(g.poNo);
      if (lp!==k) continue;
      const hit = (l.poLine!=null && poLine!=null && String(l.poLine)===String(poLine)) || ((l.poLine==null||poLine==null) && itemCode && normKey(l.itemCode)===normKey(itemCode));
      if (hit){ qty += n(l.qty)||0; if(!docs.includes(g.grpoNo)) docs.push(g.grpoNo); }
    }
  }
  return {qty,docs};
}
function billedElsewhere(invId, poNo, poLine){

      const key = p.poNo+"|"+pl.line;

    out.available = Math.max(0, out.received - out.billedElsewhere);

    const lbl = `Line ${m.idx+1}${m.invDesc?` (${m.invDesc.slice(0,40)})`:""}`;

    if (!m.vendorOk) reasons.push({t:"exception",m:`${lbl}: PO ${m.poNo} belongs to another vendor.`});
    if (!m.priceOk) reasons.push({t:"exception",m:`${lbl}: unit price ${fmtAmt(m.invPrice,"")} vs PO ${fmtAmt(m.poPrice,"")} (${fmtPct(m.priceVarPct)}, tolerance ±${cfg.priceTolPct}%).`});
    if (!m.received) reasons.push({t:"exception",m:`${lbl}: no GRPO posted yet for PO ${m.poNo} line ${m.poLine}.`});
    else if (!m.qtyOk) reasons.push({t:"exception",m:`${lbl}: billed qty ${fmtQty(m.invQty)} exceeds received-not-yet-billed ${fmtQty(m.available)} ${m.poUom||""}.`});
    if (m.amountCheck && !m.amountOk) warns.push(`${lbl}: qty × price ≠ line amount.`);
    if (m.invUom && m.poUom && normKey(m.invUom)!==normKey(m.poUom)) warns.push(`${lbl}: UoM on invoice (${m.invUom}) differs from PO (${m.poUom}).`);

  }

}

function parseCSV(text){
  text = text.replace(/^﻿/,"");
  const delim = (text.split("\n")[0].match(/\t/g)||[]).length > (text.split("\n")[0].match(/,/g)||[]).length ? "\t" : ",";
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===delim){ row.push(f); f=""; }
    else if (c==="\n"){ row.push(f); rows.push(row); row=[]; f=""; }
    else if (c!=="\r") f+=c;
  }
  if (f!=="" || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}

async function fileToPageCanvases(file, maxPages=3){
  const out=[];
  if (file.type==="application/pdf" || /\.pdf$/i.test(file.name)){
    if (!window.pdfjsLib) throw new Error("PDF reader did not load. Upload a JPG or PNG photo of the invoice instead.");
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf, isEvalSupported:false}).promise;
    const count = Math.min(pdf.numPages, maxPages);
    let text="";
    for (let i=1;i<=count;i++){
      const page = await pdf.getPage(i);
      try{ const tc=await page.getTextContent(); let lastY=null; for(const it of tc.items){ const y=Math.round(it.transform?.[5]||0); if(lastY!==null && Math.abs(y-lastY)>3) text+="\n"; else if(lastY!==null) text+=" "; text+=it.str; lastY=y; } text+="\n\n"; }catch(e){}
      const vp0 = page.getViewport({scale:1});
      const scale = Math.min(2.2, 1700/vp0.width);
      const vp = page.getViewport({scale});
      const c = document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
      const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
      await page.render({canvasContext:ctx, viewport:vp}).promise;
      out.push(c);
    }
    return {canvases:out, pages:pdf.numPages, text};
  }
  if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) throw new Error("Unsupported file. Upload a PDF, JPG or PNG.");
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("Could not open the image.")); im.src=url; });
    const scale = Math.min(1, 2000/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*scale); c.height=Math.round(img.naturalHeight*scale);
    const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    out.push(c);
  } finally { URL.revokeObjectURL(url); }
  return {canvases:out,pages:1};
}

function compressedDataURL(c, maxBytes=180000){
  let w=Math.min(1100,c.width), q=.72, url="";
  for (let tries=0; tries<8; tries++){
    const t=document.createElement("canvas"); t.width=w; t.height=Math.round(c.height*w/c.width);
    t.getContext("2d").drawImage(c,0,0,t.width,t.height);
    url = t.toDataURL("image/jpeg",q);
    if (url.length*0.75 < maxBytes) return url;
    if (q>.5) q-=.1; else w=Math.round(w*.8);
  }
  return url.length*0.75 < 250000 ? url : null;
}

function bindLogin(){
  $("#lm-sup").onclick=()=>{loginMode="supplier";render();};
  $("#lm-staff").onclick=()=>{loginMode="staff";render();};
  const err = m => { const e=$("#lg-err"); e.textContent=m; e.hidden=false; };
  const go = () => {
    if (loginMode==="supplier"){
      const code=$("#lg-vendor").value; const v=vendorList().find(x=>x.code===code);
      if (!v) return err("Choose your supplier name.");
      if (String($("#lg-code").value).trim()!==String(v.accessCode)) return err("Access code doesn't match. Check with Flexo Accounting.");
      S.session={role:"supplier",vendorCode:v.code,label:v.name};

  };

}

// ---- supplier upload
function scannerStatus(){
  if (S.sampleChecked && !S.sample) return `<div class="note">After uploading, type the invoice details exactly as printed on your invoice.</div>`;
  if (!S.sampleChecked) return `<div class="note">Auto-fill scanner: connecting…</div>`;
  if (!S.sample) return `<div class="note warn">Auto-fill scanner isn't available in this view, so invoice details must be typed. Ask IT to deploy the scan-invoice Supabase function to enable auto-fill.</div>`;
  if (!S.imgLimits) return `<div class="note warn">Auto-fill works for PDF invoices with selectable text in this view. Photos and scanned images can't be read here — type their details, or upload the supplier's PDF.</div>`;
  return `<div class="note ok">Auto-fill scanner ready — invoice details are filled in from the uploaded PDF or photo.</div>`;
}
function uploadView(){
  const d = S.draft;
  const canScan = !!(S.sample && S.imgLimits);
  let body = "";
  if (!d || d.stage==="idle"){
    body = `<div class="drop" id="drop">
        <b>Drop your invoice here</b>
        <p class="muted small" style="margin:6px 0 12px">PDF, JPG or PNG · one invoice per upload${S.sample?` · first ${S.imgLimits?.maxCount||3} pages are read`:""}</p>
        <label class="btn primary" for="file-in">Choose file</label>
        <input id="file-in" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" hidden>
      </div>
      <div style="margin-top:12px">${scannerStatus()}</div>`;
  } else if (d.stage==="reading" || d.stage==="scanning"){
    body = `<div class="panel-b stack" style="padding:0">
      <div class="scan-state"><div class="spinner"></div><div><b>${d.stage==="reading"?"Preparing pages…":"Scanning invoice…"}</b><div class="small muted">${esc(d.fileName)} · ${d.stage==="scanning"?"reading invoice no., PO reference, quantities and unit prices (usually 10–40 s)":""}</div></div></div>
      <div class="progress"><i style="width:${d.stage==="reading"?25:70}%"></i></div>
      ${d.stage==="scanning"?`<div><button class="btn sm" id="scan-stop">Stop and type details instead</button></div>`:""}
    </div>`;
  } else if (d.stage==="review"){
    body = reviewForm(d);
  } else if (d.stage==="done"){
    const inv = S.invoices.find(i=>i.id===d.invId);
    body = `<div class="stack">
      ${inv?supplierVerdict(inv):`<div class="note">Submitted.</div>`}
      <div class="row"><button class="btn primary" id="new-upload">Submit another invoice</button><button class="btn" id="goto-mine">View my submissions</button></div>
    </div>`;
  }
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr)">
    <section class="panel"><div class="panel-h"><h2>Submit an invoice to Flexo</h2><span class="small muted">${esc(S.session.label)} · ${esc(S.session.vendorCode)}</span></div>
    <div class="panel-b">${body}</div></section></div>`;
}

      <div class="preview">${d.previews?.[0]?`<img src="${d.previews[0]}" alt="Invoice page 1">`:`<div class="ph">No preview</div>`}</div>
      <div class="stack">
        <div class="grid g4">
          <div class="field"><label for="rv-invno">Invoice no.</label><input class="input mono" id="rv-invno" data-h="invoiceNo" value="${esc(e.invoiceNo)}"></div>
          <div class="field"><label for="rv-date">Invoice date</label><input class="input" type="date" id="rv-date" data-h="invoiceDate" value="${esc(e.invoiceDate)}"></div>
          <div class="field"><label for="rv-po">PO no(s).</label><input class="input mono" id="rv-po" data-h="poNumbers" value="${esc(e.poNumbers.join(", "))}"></div>

          <div class="field"><label for="rv-total">Total amount due</label><input class="input num" id="rv-total" data-h="totalAmount" value="${e.totalAmount??""}"></div>

// ---- staff queue
function queueView(){
  const inv = S.invoices;
  const agg = k => { const xs=inv.filter(i=>k==="ready"?["ready","approved"].includes(i.status):i.status===k); return {c:xs.length, a:xs.reduce((s,i)=>s+(invTotal(i)||0),0)}; };
  const k = {ready:agg("ready"),exception:agg("exception"),review:agg("review"),paid:agg("paid")};
  const labels = {ready:"Ready for payment",exception:"Exceptions",review:"Needs review",paid:"Paid"};
  let rows = inv.filter(i => S.filter==="all" ? true : S.filter==="ready" ? ["ready","approved"].includes(i.status) : i.status===S.filter);
  if (S.q){ const q=S.q.toLowerCase(); rows=rows.filter(i=>[i.vendorName,i.vendorCode,i.extracted?.invoiceNo,(i.extracted?.poNumbers||[]).join(" "),...(i.match?.lines||[]).map(l=>l.poNo)].join(" ").toLowerCase().includes(q)); }
  rows.sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt)));
  const noSap = !S.pos.length || !S.grpos.length;
  return `
  ${noSap?`<div class="note warn" style="margin-bottom:14px">SAP data is incomplete (${S.pos.length} POs, ${S.grpos.length} GRPOs loaded). Import under <b>SAP data</b> so invoices can be matched.</div>`:""}

  <section class="panel">
    <div class="panel-h"><h2>${S.filter==="all"?"All invoices":labels[S.filter]||"Returned to supplier"}</h2>
      <div class="filters">
        <input class="input" id="q" type="search" placeholder="Search vendor, invoice, PO" value="${esc(S.q)}">
        <select class="input" id="flt"><option value="ready"${S.filter==="ready"?" selected":""}>Ready for payment</option><option value="exception"${S.filter==="exception"?" selected":""}>Exceptions</option><option value="review"${S.filter==="review"?" selected":""}>Needs review</option><option value="paid"${S.filter==="paid"?" selected":""}>Paid</option><option value="rejected"${S.filter==="rejected"?" selected":""}>Returned</option><option value="all"${S.filter==="all"?" selected":""}>All</option></select>
        <button class="btn sm" id="recheck">Re-check open exceptions</button>
        ${S.filter==="ready"?`<button class="btn sm primary" id="export-ready" ${rows.length?"":"disabled"}>Export for payment (CSV)</button>`:""}
      </div>
    </div>

    ${rows.map(i=>{ const m=i.match||{lines:[]}; const pOk=m.lines.length&&m.lines.every(l=>l.priceOk); const qOk=m.lines.length&&m.lines.every(l=>l.qtyOk);
      const pos=[...new Set(m.lines.map(l=>l.poNo).filter(Boolean))], grs=[...new Set(m.lines.flatMap(l=>l.grpoNos||[]))];
      return `<tr class="click" data-open="${esc(i.id)}" tabindex="0"><td class="mono small">${fmtDT(i.submittedAt)}${i.sample?` <span class="tag">SAMPLE</span>`:""}</td><td><b>${esc(i.vendorName)}</b><div class="small muted mono">${esc(i.vendorCode)}</div></td><td class="mono">${esc(i.extracted?.invoiceNo||"—")}<div class="small muted">${fmtDate(i.extracted?.invoiceDate)}</div></td><td class="mono small">${pos.map(esc).join(", ")||"—"}<div class="muted">${grs.map(esc).join(", ")}</div></td><td class="num">${fmtAmt(invTotal(i),i.extracted?.currency)}</td><td><span class="chk ${pOk?"y":"n"}">Price ${pOk?"✓":"✕"}</span> <span class="chk ${qOk?"y":"n"}">Qty ${qOk?"✓":"✕"}</span></td><td>${pill(i.status)}</td></tr>`; }).join("") || `<tr><td colspan="7" class="empty">Nothing here.</td></tr>`}

async function importFile(kind, file){
  const st=$("#imp-status-"+kind);
  const show = (h)=>{ const el=$("#imp-status-"+kind); if(el) el.innerHTML=h; };
  try{
    const text = await file.text(); const rows=parseCSV(text);
    if (rows.length<2) throw new Error("The file has no data rows.");
    const docs = kind==="po"?buildPOs(rows):buildGRPOs(rows);
    if (!docs.length) throw new Error("No documents found — check the DocNum column.");
    const col = kind==="po"?"sap_po":"sap_grpo"; let done=0;
    show(`<div class="progress"><i style="width:0%"></i></div><div class="small muted">Importing ${docs.length} documents…</div>`);
    const queue = docs.slice(); const at=nowISO();
    const worker = async()=>{ while(queue.length){ const d=queue.shift(); const id=(kind==="po"?"PO-":"GR-")+safeId(kind==="po"?d.poNo:d.grpoNo);
      let tries=0; for(;;){ try{ await S.db.doc(col+"/"+id).set(Object.assign(d,{importedAt:at})); break; }catch(e){ if(e?.code==="unavailable"&&tries++<1){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); continue; } throw e; } }
      done++; const bar=$("#imp-status-"+kind+" .progress>i"); if(bar) bar.style.width=(done/docs.length*100)+"%"; } };
    await Promise.all([worker(),worker(),worker(),worker()]);
    const meta = Object.assign({}, S.meta||{}); meta[kind]={at, by:S.session.label, docs:docs.length, rows:rows.length-1};
    await S.db.doc("settings/sap_import").set(meta);
    toast(`Imported ${docs.length} ${kind==="po"?"POs":"GRPOs"}`);
    await recheckExceptions(true);
  }catch(e){
    const msg = e?.code==="quota_exceeded" ? "The portal's storage is full. Remove old POs/GRPOs (keep only open documents) and try again." : (e?.message||String(e));
    show(`<div class="note bad">Import stopped: ${esc(msg)}</div>`);
  }
}
async function recheckExceptions(silent){
  const open = S.invoices.filter(i=>["exception","review"].includes(i.status));
  let cleared=0;
  for (const inv of open){ const mm=runMatch(inv);
    const changed = mm.verdict!==inv.status || JSON.stringify(mm.reasons)!==JSON.stringify(inv.match?.reasons||[]);
    if (changed){ await patchInvoice(inv,{match:mm,status:mm.verdict}, mm.verdict!==inv.status?`Auto re-check → ${STATUS[mm.verdict].label}`:null); if(mm.verdict==="ready") cleared++; } }
  if (!silent || cleared) toast(`Re-checked ${open.length} open invoice${open.length===1?"":"s"} · ${cleared} now ready for payment`);
}

// ---------- supplier flow ----------
async function startUpload(file){
  if (file.size > 25*1024*1024) return toast("File is over 25 MB. Upload a smaller scan.");
  S.draft = {stage:"reading", file, fileName:file.name, extracted:cleanExtract({}), previews:[], canvases:[], scanned:false};
  render();
  try{
    const {canvases,pages,text} = await fileToPageCanvases(file, Math.max(3, S.imgLimits?.maxCount||3));
    S.draft.canvases=canvases; S.draft.pageTotal=pages; S.draft.pdfText = text ?? null;
    S.draft.previews = canvases.map(c=>compressedDataURL(c)).filter(Boolean);
  }catch(e){ S.draft.stage="review"; S.draft.error=e.message||String(e); render(); return; }
  if (!S.sampleChecked && S.sampleReady) await Promise.race([S.sampleReady, new Promise(r=>setTimeout(r,12000))]);
  if (S.sample && (S.imgLimits || (S.draft.pdfText||"").replace(/\s/g,"").length>40)) await doScan();
  else if (!S.sample){ S.draft.stage="review"; S.draft.extracted.lines.push({poNo:"",itemCode:"",description:"",qty:null,uom:"",unitPrice:null,amount:null}); render(); }
  else { S.draft.stage="review"; S.draft.error = !S.sample ? "Auto-fill scanner isn't available in this view. Type the details from the invoice." : S.draft.pdfText!=null ? "This PDF is a scanned image with no text, and this view can't read images. Type the details, or ask the supplier for a text PDF." : "This view can't read photos. Type the details, or upload the invoice as a PDF."; render(); }
}
async function doScan(){
  const d=S.draft; d.stage="scanning"; d.error=""; d.ctl=new AbortController(); render();
  try{
    const {raw,via} = await scanDocument(d, S.session.vendorCode, d.ctl.signal);
    d.extracted = cleanExtract(raw); d.scanned=true; d.scanVia=via;
    const filled = ["invoiceNo","invoiceDate","supplierTIN","totalAmount"].filter(k=>d.extracted[k]!==""&&d.extracted[k]!=null).length + (d.extracted.poNumbers.length?1:0);
    if (!filled && !d.extracted.lines.length) d.error = "The scan ran but found no invoice details. Check that the file is the invoice and is legible, then press Scan again or type the details."; d.scannedCopy=JSON.parse(JSON.stringify(d.extracted));
    if (!d.extracted.lines.length) d.extracted.lines.push({poNo:"",itemCode:"",description:"",qty:null,uom:"",unitPrice:null,amount:null});
  }catch(e){
    if (e?.code!=="cancelled") d.error = (SAMPLE_ERR[e?.code] || "Scanning didn't finish. Press Scan again, or type the details below.") + (e?.code?` [${e.code}]`:"");
    if (!d.extracted.lines.length) d.extracted.lines.push({poNo:"",itemCode:"",description:"",qty:null,uom:"",unitPrice:null,amount:null});
  }
  d.stage="review"; render();
}
function diffEdits(a,b){
  if (!a) return [];
  const out=[]; const f=v=>v==null?"":String(v);
  for (const k of ["invoiceNo","invoiceDate","supplierTIN","currency","vatAmount","totalAmount"]) if (f(a[k])!==f(b[k])) out.push(`${k} "${f(a[k])}" → "${f(b[k])}"`);
  if ((a.poNumbers||[]).join(",")!==(b.poNumbers||[]).join(",")) out.push(`PO "${(a.poNumbers||[]).join(",")}" → "${(b.poNumbers||[]).join(",")}"`);
  const L=Math.max(a.lines.length,b.lines.length);
  for (let i=0;i<L;i++){ const x=a.lines[i], y=b.lines[i]; if(!x){out.push(`line ${i+1} added`);continue;} if(!y){out.push(`line ${i+1} removed`);continue;}
    for (const k of ["poNo","qty","unitPrice","amount","description"]) if (f(x[k])!==f(y[k])) out.push(`line ${i+1} ${k} "${f(x[k])}" → "${f(y[k])}"`); }
  return out.slice(0,20);
}
async function submitDraft(){
  const d=S.draft; const e=d.extracted;
  e.lines = e.lines.filter(l=>l.description||l.qty!=null||l.unitPrice!=null);
  if (!e.invoiceNo) return toast("Enter the invoice number.");
  if (!e.lines.length) return toast("Add at least one invoice line.");
  if (e.lines.some(l=>l.qty==null||l.unitPrice==null)) return toast("Each line needs a quantity and unit price.");
  const btn=$("#submit-inv"); if(btn){btn.disabled=true;btn.textContent="Submitting…";}
  try{
    const id = "INV-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
    const vendor = vendorList().find(v=>v.code===S.session.vendorCode)||{};
    let assetId=null;
    if (S.assets){ try{ const r=await S.assets.upload(d.file, d.file.type?undefined:{type:"application/pdf"}); assetId=r.id; }catch(err){ assetId=null; } }
    let pageCount=0;
    for (let i=0;i<d.previews.length;i++){ try{ await S.db.doc("invoice_files/"+id+"-p"+(i+1)).set({invoiceId:id,page:i+1,dataUrl:d.previews[i]}); pageCount++; }catch(err){ break; } }
    const inv = { id, vendorCode:S.session.vendorCode, vendorName:vendor.name||S.session.label, fileName:d.fileName, assetId, pageCount, pageTotal:d.pageTotal||pageCount,
      extracted:e, scanned:d.scanned, supplierEdits:d.scanned?diffEdits(d.scannedCopy,e):[], submittedAt:nowISO(), updatedAt:nowISO(), history:[] };
    const mm = runMatch(inv); inv.match=mm; inv.status=mm.verdict;
    inv.history=[{at:inv.submittedAt,by:S.session.label,e:`Submitted (${d.scanned?"scanned":"typed"}) → system verdict: ${STATUS[mm.verdict].label}`}];
    await saveInvoice(id, inv);
    S.draft={stage:"done",invId:id}; render();
  }catch(err){
    toast(err?.code==="quota_exceeded"?"The portal's storage is full. Contact Flexo Accounting.":"Couldn't submit — check your connection and press Submit again.");
    if(btn){btn.disabled=false;btn.textContent="Submit to Flexo";}
  }
}

// ---------- export / housekeeping ----------
async function exportReady(){
  const rows = S.invoices.filter(i=>["ready","approved"].includes(i.status));
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[["Status","Vendor Code","Vendor","Invoice No","Invoice Date","PO No","PO Line","GRPO No","Item","Qty","UoM","Unit Price","Line Amount","VAT","Invoice Total","Currency","Override Reason","Submitted"].join(",")];
  for (const i of rows) for (const l of (i.match?.lines||[])) lines.push([STATUS[i.status].label,i.vendorCode,i.vendorName,i.extracted?.invoiceNo,i.extracted?.invoiceDate,l.poNo,l.poLine,(l.grpoNos||[]).join(" "),l.invDesc,l.invQty,l.invUom||l.poUom,l.invPrice,l.invAmount??(l.invQty*l.invPrice),i.extracted?.vatAmount,invTotal(i),i.extracted?.currency||"PHP",i.overrideReason||"",i.submittedAt].map(q).join(","));
  const data = lines.join("\r\n");
  if (!S.downloads){ toast("Downloads aren't available in this view."); return; }
  try{ const r=await S.downloads.save({filename:`flexo-ready-for-payment-${new Date().toISOString().slice(0,10)}.csv`, data}); if(r.status==="saved") toast("Saved"); }catch(e){ if(e?.code!=="cancelled"&&e?.code!=="declined") toast("Download didn't complete."); }
}
let clearArm=false;
async function clearSample(e){
  const b=e.currentTarget;
  if (!clearArm){ clearArm=true; b.textContent="Click again to confirm"; setTimeout(()=>{clearArm=false; if(b.isConnected) b.textContent="Clear sample data";},4000); return; }
  b.disabled=true; b.textContent="Clearing…";
  for (const p of S.pos.filter(x=>x.sample)) await S.db.doc("sap_po/"+p.id).delete();
  for (const g of S.grpos.filter(x=>x.sample)) await S.db.doc("sap_grpo/"+g.id).delete();
  for (const i of S.invoices.filter(x=>x.sample)){ for (let p=1;p<=(i.pageCount||0);p++) await S.db.doc("invoice_files/"+i.id+"-p"+p).delete(); await S.db.doc("invoices/"+i.id).delete(); }
  for (const v of S.vendors.filter(x=>x.sample)) await S.db.doc("vendors/"+v.id).delete();
  toast("Sample data cleared");
}

document.addEventListener("keydown",e=>{ if(e.key==="Escape" && S.openId){ S.openId=null; renderDrawer(); } });
boot();
})();
